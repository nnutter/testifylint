name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Read the release state
        id: state
        run: |
          if state="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$state" == "true" ]]; then state=draft; else state=published; fi
          else
            state=none
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Create the release
        if: steps.state.outputs.state == 'none'
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
